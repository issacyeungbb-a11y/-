<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>數學勇者 Math Quest RPG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            animation: {
              'shake': 'shake 0.4s ease-in-out',
              'pop': 'pop 0.3s ease-out',
              'float': 'float 3s ease-in-out infinite',
            },
            keyframes: {
              shake: { '0%,100%': { transform: 'translateX(0)' }, '25%': { transform: 'translateX(-8px)' }, '75%': { transform: 'translateX(8px)' } },
              pop: { '0%': { transform: 'scale(0.8)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
              float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-8px)' } },
            }
          }
        }
      }
    </script>
    <style>
      body { font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
      .glass { background: rgba(15,23,42,0.75); border: 1px solid rgba(148,163,184,0.2); backdrop-filter: blur(8px); }
    </style>
  </head>
  <body class="min-h-screen bg-slate-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
